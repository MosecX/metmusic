name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore debug keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.METMUSIC_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo "METMUSIC_DEBUG_KEYSTORE secret not set; a fresh debug keystore will be auto-generated"
          fi

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metmusic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk