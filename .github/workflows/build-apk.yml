name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore debug keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.METMUSIC_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::METMUSIC_DEBUG_KEYSTORE secret is not set; App Links auto-verify will fail."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          SHA=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | grep "SHA256:" | awk '{print $NF}')
          echo "keystore SHA256: $SHA"
          if [ "$SHA" != "EF:F1:6B:A8:70:BF:2E:E9:82:6A:FA:80:1C:33:D4:49:9F:A9:D1:D5:5B:87:B8:76:F8:71:0D:F2:C2:1E:36:10" ]; then
            echo "::error::Restored keystore fingerprint does not match assetlinks.json"
            exit 1
          fi

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metmusic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk